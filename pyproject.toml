[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kokoro-deutsch-gruut"
version = "0.1.0"
description = "Fine-tuning Kokoro-82M for German TTS using StyleTTS2"
readme = "README.md"
authors = [
    { name="semidark" },
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent"
]
requires-python = ">=3.11, <3.12"
dependencies = [
    "huggingface_hub",
    "loguru",
    "misaki-gruut[en,de,fr]==0.9.4",
    "numpy",
    "soundfile",
    "torch<2.8.0",
    "transformers"
]

[project.scripts]
kokoro = "kokoro.__main__:main"

[tool.hatch.build.targets.wheel]
only-include = ["kokoro/kokoro"]
sources = ["kokoro"]
only-packages = true

[project.urls]
Homepage = "https://github.com/bkiefer/kikiri-tts"
Repository = "https://github.com/bkiefer/kikiri-tts"
Upstream = "https://github.com/semidark/kikiri-tts"

[[tool.uv.index]]
name = "cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "cu126" }
misaki-gruut = { git = "https://github.com/bkiefer/misaki_gruut.git", tag = "v0.9.4" }
